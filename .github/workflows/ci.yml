name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: qsonaut
          POSTGRES_USER: qsonaut
          POSTGRES_PASSWORD: qsonaut-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qsonaut -d qsonaut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QSONAUT_DATABASE_URL: postgresql://qsonaut:qsonaut-ci-password@127.0.0.1:5432/qsonaut
      QSONAUT_TEST_DATABASE_URL: postgresql://qsonaut:qsonaut-ci-password@127.0.0.1:5432/qsonaut
      QSONAUT_SERVER_BIND: 127.0.0.1:18081
      QSONAUT_SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require unique migration versions
        shell: bash
        run: |
          versions="$(find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          test -z "$duplicates"
      - name: Apply migrations and reach readiness
        shell: bash
        run: |
          cargo run -p qsonaut-server > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..300}; do
            if curl --fail --silent http://127.0.0.1:18081/api/v1/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Verify migrated database contracts
        run: cargo test -p qsonaut-store --test postgres_contracts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: qsonaut-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
