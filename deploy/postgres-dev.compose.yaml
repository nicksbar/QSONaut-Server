name: qsonaut-server-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qsonaut
      POSTGRES_USER: qsonaut
      POSTGRES_PASSWORD: qsonaut-dev-password
    ports:
      - "127.0.0.1:${QSONAUT_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - qsonaut-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsonaut -d qsonaut"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  qsonaut-dev-data:
